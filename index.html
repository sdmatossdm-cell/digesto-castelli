<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digesto Municipal de Castelli</title>
  <meta name="description" content="Consultá ordenanzas, decretos, resoluciones y demás normativa municipal de Castelli.">

  <meta property="og:title" content="Digesto Municipal de Castelli">
  <meta property="og:description" content="Honorable Concejo Deliberante de Castelli. Consultá la normativa municipal.">
  <meta property="og:url" content="https://sdmatossdm-cell.github.io/digesto-castelli/">
  <meta property="og:site_name" content="Digesto Municipal de Castelli">
  <meta property="og:image" content="https://sdmatossdm-cell.github.io/digesto-castelli/logo-hcd.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f4f8;
      color: #243247;
      font-family: Arial, Helvetica, sans-serif;
    }

    .contenedor {
      width: 100%;
      max-width: 620px;
      padding: 36px 28px;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 5px 24px rgba(0, 0, 0, 0.09);
    }

    .logo {
      display: block;
      width: 150px;
      max-width: 65%;
      height: auto;
      margin: 0 auto 22px;
    }

    .institucion {
      margin: 0 0 10px;
      color: #46566b;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      line-height: 1.5;
    }

    h1 {
      margin: 0 0 18px;
      color: #183b65;
      font-size: 30px;
      line-height: 1.2;
    }

    .descripcion {
      margin: 0 auto 28px;
      max-width: 470px;
      color: #526174;
      font-size: 16px;
      line-height: 1.7;
    }

    .boton {
      display: inline-block;
      width: 100%;
      max-width: 360px;
      padding: 17px 22px;
      border-radius: 8px;
      background: #174a7e;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      letter-spacing: 0.4px;
      transition: background 0.2s ease;
    }

    .boton:hover {
      background: #10375f;
    }

    .pie {
      margin: 24px 0 0;
      color: #7b8795;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }

      .contenedor {
        padding: 28px 20px;
      }

      .logo {
        width: 125px;
      }

      h1 {
        font-size: 25px;
      }

      .descripcion {
        font-size: 15px;
      }

      .boton {
        padding: 16px 12px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="contenedor">

    <img
      class="logo"
      src="https://sdmatossdm-cell.github.io/digesto-castelli/logo-hcd.png"
      alt="Escudo del Honorable Concejo Deliberante de Castelli"
    >

    <p class="institucion">
      HONORABLE CONCEJO DELIBERANTE CASTELLI
    </p>

    <h1>Digesto Municipal de Castelli</h1>

    <p class="descripcion">
      Consultá ordenanzas, decretos, resoluciones y demás normativa municipal.
    </p>

    <a
      class="boton"
      href="https://script.google.com/macros/s/AKfycbxFHVoULv4MbfzItHAdrD8iWF4uM9N1Ufj9LrM00iCAQv5YRpJ-6gdVfd6A3w-xtXemow/exec"
      target="_blank"
      rel="noopener noreferrer"
    >
      INGRESAR AL DIGESTO
    </a>

    <p class="pie">
      Honorable Concejo Deliberante de Castelli
    </p>

  </main>
</body>
</html>
